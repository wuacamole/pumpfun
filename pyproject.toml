[project]
name = "pumpfun"
version = "0.1.0"
description = "Pump.fun conviction scoring + edge-validation system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "websockets>=16.0",
    "httpx>=0.27",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "solders>=0.27.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
